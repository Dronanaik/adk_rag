name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "mkdocs-pages"
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: Build & Deploy MkDocs + Sync GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync GitHub Releases for all v* tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          for TAG in $(git tag -l "v*" --sort=v:refname); do
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Creating GitHub Release for $TAG..."
              gh release create "$TAG" --title "ADK Agentic RAG $TAG" --notes-file RELEASE_NOTES.md
            fi
          done
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -n "$LATEST_TAG" ]; then
            gh release edit "$LATEST_TAG" --latest --notes-file RELEASE_NOTES.md || true
          fi

      - name: Sync RELEASE_NOTES.md into docs/
        run: cp RELEASE_NOTES.md docs/RELEASE_NOTES.md

      - name: Configure Git user for gh-pages deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install MkDocs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build and deploy documentation to gh-pages branch
        run: mkdocs gh-deploy --force --clean
