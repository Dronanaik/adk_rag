services:
  - type: web
    name: adk-rag-backend
    env: python
    buildCommand: "bash build.sh"
    startCommand: "uvicorn app.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: "neo4j"
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: "neo4j"
      - key: ALLOWED_ORIGINS
        sync: false # Set this in Render dashboard to your Netlify URL (e.g., https://my-app.netlify.app)
