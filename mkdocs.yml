site_name: ADK Agentic RAG
site_description: Combining Agentic RAG, Knowledge Graphs and Hybrid Vector-Graph Retrieval to transform fragmented information into connected intelligence and Gemini 2.5.
site_url: https://dronanaik.github.io/adk_rag/
repo_url: https://github.com/Dronanaik/adk_rag
repo_name: Dronanaik/adk_rag
edit_uri: edit/main/docs/
copyright: "Where Knowledge Connects, Agents Reason, and Intelligence Emerges."
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/hub
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: white
      accent: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: grey
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/custom.css
  - stylesheets/homepage.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Dronanaik/adk_rag
      name: GitHub Repository
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/drona-l/
      name: LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/drona_l
      name: X.com
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/spotter_naik/
      name: Instagram

nav:
  - Home: index.md
  - Build & Get Started:
      - Quickstart & Installation: INSTALLATION.md
      - Interactive User Guide: USER_GUIDE.md
  - Architecture & Specs:
      - System Architecture: ARCHITECTURE.md
      - Technical Specifications: TECHNICAL_SPECIFICATIONS.md
  - Core Platform:
      - 5-Step Dual Ingestion: INGESTION.md
      - Agentic Chat & Graph Tools: CHAT.md
      - Bioluminescent React UI: FRONTEND.md
  - API & Operations:
      - REST API Reference: API.md
      - Cloud Deployment: DEPLOYMENT.md
      - Troubleshooting: TROUBLESHOOTING.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
