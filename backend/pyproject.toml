[project]
name = "adk-rag-backend"
version = "1.0.0"
description = "Agentic RAG System with Centralized Memory and Knowledge Graph (FastAPI + Google ADK)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "google-adk>=1.0.0,<2.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "pgvector>=0.3.5,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "tiktoken>=0.8.0,<1.0.0",
    "structlog>=24.4.0,<26.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/app", "backend/tests", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["app.utils.document_parser", "pymupdf", "pymupdf.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
