<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1"/>
    </pattern>
    <filter id="card-shadow" x="-5%" y="-8%" width="110%" height="122%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1440" height="720" rx="14" fill="#f8fafc"/>
  <rect width="1440" height="720" rx="14" fill="url(#dot-grid)"/>

  <!-- Header Banner -->
  <rect x="24" y="20" width="1392" height="54" rx="10" fill="#0f172a"/>
  <text x="46" y="52" font-size="17" font-weight="800" fill="#f8fafc" letter-spacing="0.4">5-STEP DUAL INGESTION PIPELINE — VECTOR + KNOWLEDGE GRAPH ARCHITECTURE</text>
  <rect x="1296" y="33" width="98" height="28" rx="14" fill="#0ea5e9"/>
  <text x="1345" y="51" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">v2.6.0</text>

  <!-- PHASE 1 CONTAINER: EXTRACTION, CHUNKING & DEDUPLICATION -->
  <rect x="24" y="96" width="1392" height="250" rx="12" fill="#ffffff" fill-opacity="0.86" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="40" y="84" width="380" height="24" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="54" y="100" font-size="11" font-weight="700" fill="#0369a1" letter-spacing="0.4">STAGE 1 · PARSE, CHUNK &amp; SHA-256 DEDUPLICATION</text>

  <!-- Node 0: FastAPI Upload -->
  <g filter="url(#card-shadow)">
    <rect x="48" y="132" width="248" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="48" y="132" width="6" height="84" rx="3" fill="#059669"/>
    <rect x="64" y="150" width="46" height="46" rx="10" fill="#ecfdf5"/>
    <!-- FastAPI Lightning Circle Logo -->
    <svg x="71" y="157" width="32" height="32" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="#059669"/>
      <path fill="#ffffff" d="M12.7 5.5L7.5 13h4.1l-.9 5.5 5.8-7.5h-4.1z"/>
    </svg>
    <text x="122" y="156" font-size="13" font-weight="700" fill="#0f172a">FastAPI Upload</text>
    <text x="122" y="174" font-size="10.5" font-weight="600" fill="#059669">POST /documents/upload</text>
    <text x="122" y="191" font-size="10" fill="#475569">13 Formats · Multi-File Queue</text>
  </g>

  <!-- Arrow 0 -> 1 -->
  <line x1="296" y1="174" x2="342" y2="174" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-sky)"/>

  <!-- Node 1: Step 1 Docling + Gemini Vision -->
  <g filter="url(#card-shadow)">
    <rect x="346" y="132" width="286" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="346" y="132" width="6" height="84" rx="3" fill="#0284c7"/>
    <rect x="362" y="150" width="46" height="46" rx="10" fill="#e0f2fe"/>
    <!-- Document + AI Vision Logo -->
    <svg x="369" y="157" width="32" height="32" viewBox="0 0 24 24">
      <path fill="#0284c7" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm4 18H6V4h7v5h5z"/>
      <path fill="#0369a1" d="M8 12h8v1.6H8zm0 3.2h8v1.6H8z"/>
    </svg>
    <text x="420" y="156" font-size="13" font-weight="700" fill="#0f172a">Step 1 · Docling + Vision</text>
    <text x="420" y="174" font-size="10.5" font-weight="600" fill="#0284c7">app/parsers.py</text>
    <text x="420" y="191" font-size="10" fill="#475569">Lossless Tables &amp; Layout Markdown</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="632" y1="174" x2="678" y2="174" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-sky)"/>

  <!-- Node 2: Step 2 Semantic Chunking -->
  <g filter="url(#card-shadow)">
    <rect x="682" y="132" width="276" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="682" y="132" width="6" height="84" rx="3" fill="#6366f1"/>
    <rect x="698" y="150" width="46" height="46" rx="10" fill="#eef2ff"/>
    <!-- Chunk Blocks Logo -->
    <svg x="705" y="157" width="32" height="32" viewBox="0 0 24 24">
      <rect x="3" y="4" width="8" height="7" rx="1.5" fill="#6366f1"/>
      <rect x="13" y="4" width="8" height="7" rx="1.5" fill="#818cf8"/>
      <rect x="3" y="13" width="8" height="7" rx="1.5" fill="#818cf8"/>
      <rect x="13" y="13" width="8" height="7" rx="1.5" fill="#4f46e5"/>
    </svg>
    <text x="756" y="156" font-size="13" font-weight="700" fill="#0f172a">Step 2 · Semantic Chunker</text>
    <text x="756" y="174" font-size="10.5" font-weight="600" fill="#4f46e5">app/chunking.py</text>
    <text x="756" y="191" font-size="10" fill="#475569">1,200 Chars · 200 Overlap</text>
  </g>

  <!-- Arrow 2 -> Dedup Gate -->
  <line x1="958" y1="174" x2="1006" y2="174" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-sky)"/>

  <!-- Node Dedup: SHA-256 Content-Hash Gate -->
  <g filter="url(#card-shadow)">
    <rect x="1010" y="126" width="378" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="1010" y="126" width="6" height="96" rx="3" fill="#d97706"/>
    <rect x="1026" y="151" width="46" height="46" rx="10" fill="#fef3c7"/>
    <!-- Shield Fingerprint Logo -->
    <svg x="1033" y="158" width="32" height="32" viewBox="0 0 24 24">
      <path fill="#d97706" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12c5.16-1.26 9-6.45 9-12V5zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11z"/>
    </svg>
    <text x="1084" y="152" font-size="13" font-weight="700" fill="#0f172a">SHA-256 Deduplication Gate</text>
    <text x="1084" y="170" font-size="10.5" font-weight="600" fill="#b45309">find_existing_user_document()</text>
    <text x="1084" y="187" font-size="10" fill="#475569">• Unchanged / Duplicate Hash → Fast Skip</text>
    <text x="1084" y="203" font-size="10" fill="#475569">• Updated File → Atomic Purge Old &amp; Re-Index</text>
  </g>

  <!-- Fast Skip Badge -->
  <g filter="url(#card-shadow)">
    <rect x="1010" y="248" width="210" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="1115" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Fast Skip (0 API Cost)</text>
    <text x="1115" y="294" text-anchor="middle" font-size="10" fill="#64748b">Reuses Existing Neon &amp; Neo4j IDs</text>
  </g>
  <line x1="1115" y1="222" x2="1115" y2="244" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-slate)"/>

  <!-- Atomic Purge Badge -->
  <g filter="url(#card-shadow)">
    <rect x="1238" y="248" width="150" height="72" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
    <text x="1313" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Atomic Purge</text>
    <text x="1313" y="294" text-anchor="middle" font-size="10" fill="#7f1d1d">Clean Old Version</text>
  </g>
  <line x1="1313" y1="222" x2="1313" y2="244" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-amber)"/>

  <!-- Connector from Stage 1 to Stage 2 -->
  <path d="M 1313 320 L 1313 358 L 210 358 L 210 404" fill="none" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-sky)"/>
  <rect x="615" y="346" width="240" height="22" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="735" y="361" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1">New or Updated Document Chunks</text>

  <!-- PHASE 2 CONTAINER: EMBEDDINGS & DUAL VECTOR/GRAPH STORAGE -->
  <rect x="24" y="388" width="1392" height="226" rx="12" fill="#ffffff" fill-opacity="0.86" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="40" y="376" width="430" height="24" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="54" y="392" font-size="11" font-weight="700" fill="#6d28d9" letter-spacing="0.4">STAGE 2 · GEMINI EMBEDDINGS + DUAL NEON &amp; NEO4J INDEXING</text>

  <!-- Node 3: Step 3 Gemini Embeddings -->
  <g filter="url(#card-shadow)">
    <rect x="48" y="424" width="330" height="114" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="48" y="424" width="6" height="114" rx="3" fill="#2563eb"/>
    <rect x="66" y="454" width="52" height="52" rx="12" fill="#eff6ff"/>
    <!-- Google Gemini 4-Point Sparkle Logo -->
    <svg x="74" y="462" width="36" height="36" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="gemini-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="50%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
      </defs>
      <path fill="url(#gemini-grad)" d="M12 2C12.3 7.3 16.7 11.7 22 12C16.7 12.3 12.3 16.7 12 22C11.7 16.7 7.3 12.3 2 12C7.3 11.7 11.7 7.3 12 2Z"/>
    </svg>
    <text x="132" y="454" font-size="13.5" font-weight="700" fill="#0f172a">Step 3 · Gemini Embeddings</text>
    <text x="132" y="473" font-size="11" font-weight="600" fill="#2563eb">gemini-embedding-001 (768-dim)</text>
    <text x="132" y="492" font-size="10.5" fill="#475569">Batched Vectorization (50 chunks/req)</text>
    <text x="132" y="510" font-size="10" fill="#64748b">Module: app/embeddings.py</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="378" y1="481" x2="452" y2="481" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-emerald)"/>

  <!-- Node 4: Step 4 Neon PostgreSQL + pgvector -->
  <g filter="url(#card-shadow)">
    <rect x="456" y="424" width="424" height="114" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="456" y="424" width="6" height="114" rx="3" fill="#059669"/>
    <rect x="474" y="454" width="52" height="52" rx="12" fill="#ecfdf5"/>
    <!-- Neon PostgreSQL Database Logo -->
    <svg x="482" y="462" width="36" height="36" viewBox="0 0 24 24">
      <ellipse cx="12" cy="6" rx="8" ry="3" fill="#10b981"/>
      <path fill="#059669" d="M4 6v5c0 1.66 3.58 3 8 3s8-1.34 8-3V6c0 1.66-3.58 3-8 3S4 7.66 4 6z"/>
      <path fill="#047857" d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6c0 1.66-3.58 3-8 3s-8-1.34-8-3z"/>
    </svg>
    <text x="540" y="454" font-size="13.5" font-weight="700" fill="#0f172a">Step 4 · Neon PostgreSQL (pgvector)</text>
    <text x="540" y="473" font-size="11" font-weight="600" fill="#059669">HNSW Cosine Index + GIN Full-Text</text>
    <text x="540" y="492" font-size="10.5" fill="#475569">Tables: documents, document_chunks (user_id)</text>
    <text x="540" y="510" font-size="10" fill="#64748b">Module: app/rag_store.py</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="880" y1="481" x2="954" y2="481" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>

  <!-- Node 5: Step 5 Neo4j AuraDB Knowledge Graph -->
  <g filter="url(#card-shadow)">
    <rect x="958" y="424" width="430" height="114" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="958" y="424" width="6" height="114" rx="3" fill="#7c3aed"/>
    <rect x="976" y="454" width="52" height="52" rx="12" fill="#f3e8ff"/>
    <!-- Neo4j Connected Graph Nodes Logo -->
    <svg x="984" y="462" width="36" height="36" viewBox="0 0 24 24">
      <line x1="7" y1="17" x2="12" y2="6" stroke="#7c3aed" stroke-width="2"/>
      <line x1="12" y1="6" x2="18" y2="16" stroke="#7c3aed" stroke-width="2"/>
      <line x1="7" y1="17" x2="18" y2="16" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="12" cy="6" r="3.2" fill="#0ea5e9"/>
      <circle cx="7" cy="17" r="3.2" fill="#7c3aed"/>
      <circle cx="18" cy="16" r="3.2" fill="#10b981"/>
    </svg>
    <text x="1042" y="454" font-size="13.5" font-weight="700" fill="#0f172a">Step 5 · Neo4j Knowledge Graph</text>
    <text x="1042" y="473" font-size="11" font-weight="600" fill="#7c3aed">Gemini 2.5 Flash Structured Triplets</text>
    <text x="1042" y="492" font-size="10.5" fill="#475569">MERGE (:Entity)-[:RELATES_TO]-&gt;(:Entity)</text>
    <text x="1042" y="510" font-size="10" fill="#64748b">Module: app/graph_store.py</text>
  </g>

  <!-- Live Telemetry Footer Bar -->
  <g filter="url(#card-shadow)">
    <rect x="24" y="636" width="1392" height="58" rx="10" fill="#0f172a"/>
    <circle cx="52" cy="665" r="7" fill="#22d3ee"/>
    <text x="72" y="669" font-size="12.5" font-weight="700" fill="#f8fafc">Live Per-User &amp; Multi-Document Telemetry:</text>
    <text x="366" y="669" font-size="12" fill="#cbd5e1">React UI polls</text>
    <rect x="458" y="652" width="154" height="26" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
    <text x="535" y="669" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38bdf8">GET /ingest/progress</text>
    <text x="624" y="669" font-size="12" fill="#cbd5e1">every 450ms → streams live step status, chunk counts &amp; Neo4j entity totals.</text>
  </g>
</svg>
